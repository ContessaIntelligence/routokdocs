<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in · CodeFlux</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var l = localStorage.getItem('cf-lang');
        if (l === 'zh-Hant' || l === 'zh-CN') {
          document.documentElement.lang = l;
          document.documentElement.className += ' i18n-wait';
          setTimeout(function () { document.documentElement.className = document.documentElement.className.replace(' i18n-wait', ''); }, 2500);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/style-sections.css">
  <link rel="stylesheet" href="/assets/style-more.css">
  <link rel="stylesheet" href="/assets/style-pages.css">
  <link rel="stylesheet" href="/assets/style-commerce.css">
</head>
<body data-page="oauth" data-title-zh-cn="正在登录 · CodeFlux" data-title-zh-hant="正在登入 · CodeFlux">
  <div class="glow"></div>

  <nav class="nav" id="nav">
    <div class="wrap">
      <a href="/index.html" class="logo">
        <img class="logo-img" src="/assets/logo.png" alt="CodeFlux Studio" width="36" height="36">
        <span class="logo-text">CodeFlux<span class="logo-studio">Studio</span></span>
      </a>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-cta">
        <div class="lang" id="lang">
          <button class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg>
            <span id="lang-cur">English</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="lang-menu" role="menu">
            <button type="button" role="menuitem" data-lang="en">English</button>
            <button type="button" role="menuitem" data-lang="zh-Hant">繁體中文</button>
            <button type="button" role="menuitem" data-lang="zh-CN">简体中文</button>
          </div>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="grid-bg"></div>
    <div class="auth-card" style="text-align:center">
      <h1 data-i18n="oa.h1">Signing you in…</h1>
      <p class="auth-sub" id="oauthSpin" data-i18n="oa.sub">Please wait a moment.</p>
      <div class="form"><div class="msg-box" id="formMsg" role="alert" aria-live="polite"></div></div>
      <p class="auth-alt"><a href="/login.html" data-i18n="au.f.back">Back to sign in</a></p>
    </div>
  </main>

  <script src="/assets/i18n-zh-hant.js"></script>
  <script src="/assets/i18n-zh-cn.js"></script>
  <script src="/assets/i18n-auth.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/pages.js"></script>
  <script src="/assets/auth.js"></script>
</body>
</html>
